<!DOCTYPE html>
<html>
    <head>
        <title>The Anglers Guide</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header id="main-header">
            <div id="logo">
                <img src="images/logo.png" alt="Fish logo">
                <h2>THE ANGLERS GUIDE</h2>
            </div>

            <nav id="main-nav">
                <a href="index.html">HOME</a>
                <a href="#">SPECIES</a>

                <a href="#">LOCATIONS</a>
                <a href="#">TIPS</a>

                        <a href="#">GEAR</a>

                    <div class="card">
                        <img src="images/locations.png" alt="water">
                        <a href="#">LOCATIONS</a>
                    </div>

                    <div class="card">
