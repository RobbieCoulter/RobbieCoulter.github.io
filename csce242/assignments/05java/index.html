<!DOCTYPE html>
<html>
    <head>
        <title>Assignment 5</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>

    <body> 
        <header>
            <h1>Assignmnet 5</h1>
            <h2>Intro to java script</h2>
        </header>

        <main>
            <div id="columns">
                <section class="box" id="speech-box">
                    <h3>Speech</h3>
                    <div id="speech-bubble" class="hidden">
                        Hi
                    </div>
                </section>

                <section class="box">
                    <h3>Beverage</h3>

                    <label for="beverage">
                        Pick your morning beverage:
                    </label>

                    <select id="beverage">
                        <option value="Coffee">Coffee</option>
                        <option value="Tea">Tea</option>
                        <option value="Orange Juice">Orange Juice</option>
                        <option value="Water">Water</option>
                    </select>

                    <p id="beverage-message"></p>
                </section>

                <section class="box">
                    <h3>Add a sticker</h3>

                    <div id="image-area">
                        <img src="images/sun.png" alt="sun" id="sun">

                        <span id="sticker">☀️</span>
                    </div>
                </section>
            </div>
        </main>

        <footer>@RobbieCoulter</footer>
